# التكامل المستمر (14-testing): الخادم على PostgreSQL 16 حقيقي، والواجهة، وبناء صور النشر.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gbcfms
          POSTGRES_PASSWORD: gbcfms
          POSTGRES_DB: gbcfms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gbcfms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GBCFMS_TEST_ADMIN_URL: postgresql+psycopg://gbcfms:gbcfms@localhost:5432/postgres
      GBCFMS_DATABASE_URL: postgresql+psycopg://gbcfms:gbcfms@localhost:5432/gbcfms
      PGHOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: أدوات النظام (pg_dump 16 للنسخ الاحتياطي، Pango لـ WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: تثبيت الاعتماديات
        run: |
          python -m venv .venv
          .venv/bin/python -c "import tomllib, subprocess; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; subprocess.check_call(['.venv/bin/pip', 'install', *p['dependencies'], *p['optional-dependencies']['dev']])"
      - name: Ruff
        run: .venv/bin/ruff check app tests
      - name: الترحيلات من الصفر وحتى النهاية والعودة
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: الاختبارات (بما فيها الاختبارات المالية الإلزامية)
        run: .venv/bin/pytest -n auto

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: التحقق من ملف Compose
        run: POSTGRES_PASSWORD=ci GBCFMS_JWT_SECRET=ci docker compose config -q
      - name: بناء صور النشر
        run: POSTGRES_PASSWORD=ci GBCFMS_JWT_SECRET=ci docker compose build
