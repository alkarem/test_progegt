[project]
name = "gbcfms-backend"
version = "0.1.0"
description = "نظام مراقبة الاعتمادات والمصروفات الحكومية — الخادم"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.8",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "email-validator>=2.1",
  "weasyprint>=62",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "hypothesis>=6.100", "pypdf>=4", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "B008"]  # B008: نمط Depends() القياسي في FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
