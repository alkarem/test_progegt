# نشر الشبكة المحلية (15-deployment §1): nginx وحده منشور، والباقي على شبكة داخلية.
# لا يلزم ملف .env: الأسرار تُولَّد تلقائيًا عند أول تشغيل في volume «secrets».
# ملف .env اختياري لتغيير المنافذ أو تفعيل المساعد الذكي (انظر deploy/env.example).
name: gbcfms

x-backend-env: &backend-env
  GBCFMS_ENV: prod
  # فارغة افتراضيًا فتُقرأ من الأسرار المولّدة؛ القيمة الصريحة في .env تتقدم عليها
  GBCFMS_DATABASE_URL: ${GBCFMS_DATABASE_URL:-}
  GBCFMS_JWT_SECRET: ${GBCFMS_JWT_SECRET:-}
  GBCFMS_BACKUP_KEY: ${GBCFMS_BACKUP_KEY:-}
  GBCFMS_STORAGE_DIR: /app/storage
  GBCFMS_MAX_UPLOAD_MB: ${GBCFMS_MAX_UPLOAD_MB:-20}
  GBCFMS_AI_ENABLED: ${GBCFMS_AI_ENABLED:-false}
  GBCFMS_AI_MODEL: ${GBCFMS_AI_MODEL:-claude-opus-5}
  GBCFMS_AI_MASK_PERSONAL: ${GBCFMS_AI_MASK_PERSONAL:-true}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  HTTPS_PROXY: ${AI_HTTPS_PROXY:-}
  TZ: ${TZ:-Africa/Tripoli}

services:
  secrets:
    build: ./backend
    image: gbcfms-api:${GBCFMS_VERSION:-latest}
    command: ["init-secrets"]
    restart: "no"
    volumes:
      - secrets:/secrets
    network_mode: none

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbcfms
      POSTGRES_USER: gbcfms
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      TZ: ${TZ:-Africa/Tripoli}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
    depends_on:
      secrets: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbcfms -d gbcfms"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: gbcfms-api:${GBCFMS_VERSION:-latest}
    command: ["api"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      GBCFMS_WORKERS: ${GBCFMS_WORKERS:-4}
    volumes:
      - storage:/app/storage
      - ${BACKUP_DIR:-./backups}:/app/storage/backups
      - secrets:/secrets:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  scheduler:
    image: gbcfms-api:${GBCFMS_VERSION:-latest}
    command: ["scheduler"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - storage:/app/storage
      - ${BACKUP_DIR:-./backups}:/app/storage/backups
      - secrets:/secrets:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      disable: true

  web:
    build: ./frontend
    image: gbcfms-web:${GBCFMS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      GBCFMS_HOST: ${GBCFMS_HOST:-localhost}
    volumes:
      - ${CERTS_DIR:-./deploy/certs}:/etc/nginx/certs-host:ro
      - certs:/etc/nginx/certs
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  storage:
  certs:
  secrets:
